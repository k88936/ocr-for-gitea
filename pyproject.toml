[project]
name = "gitea-ocr-review"
version = "0.1.0"
description = "Review Gitea pull requests with alibaba/open-code-review, post approve/reject verdicts, and poll for new review requests"
requires-python = ">=3.11"
dependencies = [
    "httpx[socks]>=0.28",
    "GitPython>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
gitea-ocr = "gitea_ocr_review.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gitea_ocr_review"]
